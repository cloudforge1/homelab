  # firecrawl-api:
  #   <<: *restart
  #   image: mendableai/firecrawl:latest
  #   container_name: firecrawl-api
  #   ports:
  #     - "0.0.0.0:3002:3002"
  #   environment:
  #     REDIS_URL: redis://redis-tools:6379
  #     PORT: "3002"
