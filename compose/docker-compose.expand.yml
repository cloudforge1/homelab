  #     redis-tools:
  #       condition: service_healthy

  # ── gitingest — Git repo ingestion for LLMs ────────────────────────
  # TODO: No pre-built Docker image found for gitingest/gitingest or
  #       cyclotruc/gitingest. Clone https://github.com/cyclotruc/gitingest
  #       and build: docker build -t gitingest:local .
  # gitingest:
  #   <<: *restart
  #   image: gitingest:local
  #   container_name: gitingest
  #   ports:
  #     - "0.0.0.0:8015:8015"

  # ── docetl — Document ETL pipeline ─────────────────────────────────
  # TODO: No pre-built Docker image found for ucbepic/docetl.
  #       Clone https://github.com/ucbepic/docetl and build manually.
  # docetl:
  #   <<: *restart
  #   image: ucbepic/docetl:latest
  #   container_name: docetl
  #   ports:
  #     - "0.0.0.0:8017:8017"

volumes:
  redis-tools-data:
  qdrant-data:
  postgres-tools-data:
  n8n-data:
  tensorlake-data:
  mem0-data:
  nautilus-data:
  openbb-data:
  # kokoro-data:   # uncomment when kokoro-fastapi is enabled
