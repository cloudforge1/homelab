  #   container_name: kokoro-fastapi
  #   ports:
  #     - "0.0.0.0:8880:8880"
  #   volumes:
  #     - kokoro-data:/app/voices
  #   environment:
  #     PORT: "8880"

  # ── firecrawl-api — Web scraping API ───────────────────────────────
  # TODO: No pre-built Docker image found for mendableai/firecrawl on
  #       Docker Hub or GHCR. Clone https://github.com/mendableai/firecrawl
