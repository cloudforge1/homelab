# OpenSpace — Self-evolving AI agent engine
# Standalone compose file — run alongside the main cf0 stack.
#
# Deploy:  pnpm openspace:deploy
# Logs:    pnpm openspace:logs
# Update:  pnpm openspace:update
# ───────────────────────────────────────────────────────────────────

name: cf-openspace

x-restart: &restart
  restart: unless-stopped

services:

  # ── openspace — Bundled dashboard UI + API ─────────────────────────
  openspace:
    <<: *restart
    build:
      context: ./openspace
      dockerfile: Dockerfile
      args:
        OPENSPACE_REF: ${OPENSPACE_REF:-90b2ffab6ad7acdda006ba7ada6e62022a0531d6}
    image: ${OPENSPACE_IMAGE:-cf0-openspace:latest}
    container_name: openspace
    ports:
      - "0.0.0.0:${OPENSPACE_PORT:-7788}:7788"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENSPACE_API_KEY: ${OPENSPACE_API_KEY:-}
      OPENSPACE_WORKSPACE: /app
      OPENSPACE_DASHBOARD_HOST: "0.0.0.0"
      OPENSPACE_DASHBOARD_PORT: "7788"
      OPENSPACE_HOST_SKILL_DIRS: /app/openspace/host-skills
    volumes:
      - openspace-data:/app/.openspace
      - openspace-skills:/app/openspace/skills
      - ${OPENSPACE_HOST_SKILL_DIRS:-/home/r/ai-tools/fabro/skills}:/app/openspace/host-skills:ro
    deploy:
      resources:
        limits:
          cpus: "${OPENSPACE_CPU_LIMIT:-1.0}"
          memory: ${OPENSPACE_MEMORY_LIMIT:-500M}
    healthcheck:
      test: ["CMD-SHELL", "html=$$(curl -fsS http://localhost:7788/) && printf '%s' \"$$html\" | grep -q 'OpenSpace Dashboard' && ! printf '%s' \"$$html\" | grep -q 'Build frontend/ first or run the Vite dev server.'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── openspace-mcp — MCP server for remote agents ───────────────────
  openspace-mcp:
    <<: *restart
    image: ${OPENSPACE_IMAGE:-cf0-openspace:latest}
    container_name: openspace-mcp
    depends_on:
      openspace:
        condition: service_healthy
    ports:
      - "0.0.0.0:${OPENSPACE_MCP_PORT:-7789}:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENSPACE_API_KEY: ${OPENSPACE_API_KEY:-}
      OPENSPACE_WORKSPACE: /app
      OPENSPACE_HOST_SKILL_DIRS: /app/openspace/host-skills
    volumes:
      - openspace-data:/app/.openspace
      - openspace-skills:/app/openspace/skills
      - ${OPENSPACE_HOST_SKILL_DIRS:-/home/r/ai-tools/fabro/skills}:/app/openspace/host-skills:ro
    deploy:
      resources:
        limits:
          cpus: "${OPENSPACE_CPU_LIMIT:-1.0}"
          memory: ${OPENSPACE_MEMORY_LIMIT:-500M}
    healthcheck:
      test: ["CMD-SHELL", "code=0; curl -fsS -N --max-time 2 http://localhost:8080/sse >/dev/null || code=$$?; [ \"$$code\" = 0 ] || [ \"$$code\" = 28 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["openspace-mcp", "--transport", "sse", "--port", "8080"]

volumes:
  openspace-data:
    name: openspace-data
  openspace-skills:
    name: openspace-skills
