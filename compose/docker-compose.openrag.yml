# cf0 OpenRAG Stack — Agentic RAG (Langflow + OpenSearch)
# Usage: docker compose -f docker-compose.openrag.yml up -d
#
# Requires .env with OPENSEARCH_PASSWORD set.
# -------------------------------------------------------------------

name: cf-openrag

services:
  # ── OpenSearch — Vector store ──────────────────────────────────────
  opensearch:
    image: langflowai/openrag-opensearch:${OPENRAG_VERSION:-latest}
    container_name: os
    restart: unless-stopped
    depends_on:
      openrag-backend:
        condition: service_started
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
    command: >
      bash -c "
        sudo chown -R opensearch:opensearch /usr/share/opensearch/data || true
        /usr/share/opensearch/opensearch-docker-entrypoint.sh opensearch &
        sleep 10 && /usr/share/opensearch/setup-security.sh &
        wait
      "
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - openrag-opensearch-data:/usr/share/opensearch/data

  # ── OpenSearch Dashboards ──────────────────────────────────────────
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.0.0
    container_name: osdash
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_started
    environment:
      OPENSEARCH_HOSTS: '["https://${OPENSEARCH_HOST:-opensearch}:${OPENSEARCH_PORT:-9200}"]'
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-admin}"
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    ports:
      - "5601:5601"

  # ── Langflow — Flow engine ────────────────────────────────────────
  langflow:
    image: langflowai/openrag-langflow:${OPENRAG_VERSION:-latest}
    container_name: langflow
    restart: unless-stopped
    ports:
      - "${LANGFLOW_PORT:-7860}:7860"
    volumes:
      - openrag-flows:/app/flows
      - openrag-langflow-data:/app/langflow-data
    environment:
      - LANGFLOW_AUTO_LOGIN=${LANGFLOW_AUTO_LOGIN:-true}
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER:-admin}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD:-}
      - LANGFLOW_CONFIG_DIR=/app/langflow-data
      - LANGFLOW_DATABASE_URL=sqlite:////app/langflow-data/langflow.db
      - LANGFLOW_WORKERS=${LANGFLOW_WORKERS:-1}
      - LANGFLOW_LOG_LEVEL=INFO
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:-opensearch}
      - OPENSEARCH_PORT=${OPENSEARCH_PORT:-9200}
      - OPENSEARCH_URL=https://${OPENSEARCH_HOST:-opensearch}:${OPENSEARCH_PORT:-9200}
      - OPENSEARCH_INDEX_NAME=${OPENSEARCH_INDEX_NAME:-documents}
      - HIDE_GETTING_STARTED_PROGRESS=true
    networks:
      - default
      - homelab-network

  # ── OpenRAG Backend ────────────────────────────────────────────────
  openrag-backend:
    image: langflowai/openrag-backend:${OPENRAG_VERSION:-latest}
    container_name: openrag-backend
    restart: unless-stopped
    depends_on:
      langflow:
        condition: service_started
    environment:
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:-opensearch}
      - OPENSEARCH_PORT=${OPENSEARCH_PORT:-9200}
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME:-admin}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_INDEX_NAME=${OPENSEARCH_INDEX_NAME:-documents}
      - LANGFLOW_URL=http://langflow:7860
      - LANGFLOW_AUTO_LOGIN=${LANGFLOW_AUTO_LOGIN:-true}
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER:-admin}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD:-}
      - LANGFLOW_TIMEOUT=${LANGFLOW_TIMEOUT:-2400}
      - LANGFLOW_CONNECT_TIMEOUT=${LANGFLOW_CONNECT_TIMEOUT:-30}
      - INGESTION_TIMEOUT=${INGESTION_TIMEOUT:-3600}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OLLAMA_ENDPOINT=http://ollama:11434
    volumes:
      - openrag-documents:/app/openrag-documents
      - openrag-flows:/app/flows
      - openrag-data:/app/data
    networks:
      - default
      - homelab-network

  # ── OpenRAG Frontend ───────────────────────────────────────────────
  openrag-frontend:
    image: langflowai/openrag-frontend:${OPENRAG_VERSION:-latest}
    container_name: openrag-frontend
    restart: unless-stopped
    depends_on:
      openrag-backend:
        condition: service_started
    environment:
      - OPENRAG_BACKEND_HOST=openrag-backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  openrag-opensearch-data:
  openrag-flows:
  openrag-langflow-data:
  openrag-documents:
  openrag-data:

networks:
  homelab-network:
    external: true
    name: ${HOMELAB_NETWORK_NAME:-homelab-network}
