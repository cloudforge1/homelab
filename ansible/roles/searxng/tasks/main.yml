---
# SearXNG role - Private search engine

- name: Ensure SearXNG config directory exists
  ansible.builtin.file:
    path: "{{ admin_home }}/searxng"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'
  tags: [searxng, config]

- name: Deploy SearXNG container
  community.docker.docker_compose_v2:
    project_src: "{{ compose_path }}"
    files:
      - docker-compose.yml
    services:
      - searxng
    state: present
    detached: true
  tags: [searxng, deploy]

- name: Wait for SearXNG to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:8081/"
    status_code: [200, 301, 302]
    timeout: 10
  register: searxng_health
  retries: 5
  delay: 10
  until: searxng_health.status in [200, 301, 302]
  failed_when: false
  tags: [searxng, healthcheck]
