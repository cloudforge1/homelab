---
# System tuning for cf0 — sysctl, limits, UFW, bandwidth shaping

- name: Configure kernel parameters (sysctl)
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: vm.max_map_count, value: "1048576" }
    - { name: vm.swappiness, value: "10" }
    - { name: fs.file-max, value: "2097152" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
    - { name: net.core.somaxconn, value: "65535" }
    - { name: net.core.netdev_max_backlog, value: "5000" }
    - { name: net.ipv4.tcp_max_syn_backlog, value: "65535" }
    - { name: net.ipv4.ip_local_port_range, value: "1024 65535" }
  tags: [system-tuning, sysctl]

- name: Configure system limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-homelab.conf
    content: |
      # Homelab service limits
      *    soft    nofile    1048576
      *    hard    nofile    1048576
      *    soft    nproc     65535
      *    hard    nproc     65535
      root soft    nofile    1048576
      root hard    nofile    1048576
    mode: '0644'
  tags: [system-tuning, limits]

- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  tags: [system-tuning, ufw]

- name: Set UFW default deny incoming
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
  tags: [system-tuning, ufw]

- name: Set UFW default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing
  tags: [system-tuning, ufw]

- name: Allow SSH from anywhere
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: SSH
  tags: [system-tuning, ufw]

- name: Allow homelab service ports from LAN
  community.general.ufw:
    rule: allow
    src: "{{ ufw_lan_cidr }}"
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop:
    - { port: "11434", comment: "Ollama API" }
    - { port: "8080", comment: "Open WebUI" }
    - { port: "8081", comment: "SearXNG" }
    - { port: "47334", comment: "MindsDB HTTP" }
    - { port: "47335", comment: "MindsDB MySQL" }
    - { port: "8000", comment: "Cognee API" }
    - { port: "5678", comment: "Cognee Neo4j" }
    - { port: "42617", comment: "ZeroClaw Gateway" }
    - { port: "5540", comment: "RedisInsight" }
    - { port: "3000", comment: "OpenRAG Frontend" }
    - { port: "7860", comment: "Langflow" }
    - { port: "9200", comment: "OpenSearch HTTPS" }
    - { port: "9600", comment: "OpenSearch Perf" }
    - { port: "5601", comment: "OpenSearch Dashboards" }
    - { port: "5679", comment: "n8n" }
    - { port: "8070", comment: "Nuclio" }
    - { port: "6333", comment: "Qdrant HTTP" }
    - { port: "6334", comment: "Qdrant gRPC" }
    - { port: "8900", comment: "TensorLake" }
    - { port: "8889", comment: "NautilusTrader" }
    - { port: "6900", comment: "OpenBB" }
    - { port: "4433", comment: "PostgreSQL tools" }
    - { port: "7786", comment: "Scrutiny" }
    - { port: "7788", comment: "OpenSpace" }
    - { port: "9121", comment: "Serena MCP" }
    - { port: "24282", comment: "Serena Dashboard" }
    - { port: "7861", comment: "Flowise" }
    - { port: "8888", comment: "Unsloth Jupyter" }
    - { port: "3100", comment: "Onyx" }
    - { port: "5001", comment: "docling-serve" }
  tags: [system-tuning, ufw]

- name: Create persistent data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'
  loop:
    - "{{ homelab_base_path }}/data"
    - "{{ homelab_base_path }}/logs"
    - "{{ homelab_base_path }}/backups"
  tags: [system-tuning, directories]

- name: Configure bandwidth shaping
  when: bandwidth_limit is defined and bandwidth_limit | length > 0
  block:
    - name: Check existing tc qdisc
      ansible.builtin.command:
        cmd: "tc qdisc show dev {{ nic_name }}"
      register: tc_qdisc
      changed_when: false
      failed_when: false

    - name: Remove existing bandwidth limit
      ansible.builtin.command:
        cmd: "tc qdisc del dev {{ nic_name }} root"
      when: "'htb' in tc_qdisc.stdout"
      changed_when: true

    - name: Apply bandwidth limit
      ansible.builtin.command:
        cmd: "tc qdisc add dev {{ nic_name }} root tbf rate {{ bandwidth_limit }} burst 32kbit latency 400ms"
      changed_when: true

    - name: Persist bandwidth shaping via rc.local
      ansible.builtin.copy:
        dest: /etc/rc.local
        content: |
          #!/bin/bash
          # Bandwidth shaping — managed by Ansible (system-tuning role)
          tc qdisc del dev {{ nic_name }} root 2>/dev/null || true
          tc qdisc add dev {{ nic_name }} root tbf rate {{ bandwidth_limit }} burst 32kbit latency 400ms
          exit 0
        mode: '0755'
  tags: [system-tuning, bandwidth]
