---
# Open WebUI role - Chat interface

- name: Ensure shared homelab network exists
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present
  tags: [open-webui, network]

- name: Deploy Open WebUI container
  community.docker.docker_compose_v2:
    project_src: "{{ compose_path }}"
    project_name: cf-core
    files:
      - docker-compose.yml
    services:
      - open-webui
    state: present
  tags: [open-webui, deploy]

- name: Wait for Open WebUI to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:8080/"
    status_code: [200, 301, 302]
    timeout: 10
  register: webui_health
  retries: 5
  delay: 10
  until: webui_health.status in [200, 301, 302]
  failed_when: false
  tags: [open-webui, healthcheck]
