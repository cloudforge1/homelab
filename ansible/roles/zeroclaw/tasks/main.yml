---
# ZeroClaw role - Personal AI assistant gateway

- name: Check if ZeroClaw is installed
  ansible.builtin.command: zeroclaw --version
  register: zeroclaw_version
  failed_when: false
  changed_when: false
  tags: [zeroclaw, check]

- name: Download ZeroClaw binary
  ansible.builtin.get_url:
    url: "https://github.com/zeroclaw-labs/zeroclaw/releases/download/v0.5.5/zeroclaw-x86_64-unknown-linux-gnu.tar.gz"
    dest: /tmp/zeroclaw.tar.gz
    mode: '0644'
  when: zeroclaw_version.rc != 0
  tags: [zeroclaw, install]

- name: Extract ZeroClaw
  ansible.builtin.unarchive:
    src: /tmp/zeroclaw.tar.gz
    dest: /tmp
    remote_src: yes
  when: zeroclaw_version.rc != 0
  tags: [zeroclaw, install]

- name: Install ZeroClaw to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/zeroclaw
    dest: /usr/local/bin/zeroclaw
    mode: '0755'
    remote_src: yes
  when: zeroclaw_version.rc != 0
  tags: [zeroclaw, install]

- name: Create ZeroClaw config directory
  ansible.builtin.file:
    path: "{{ admin_home }}/.zeroclaw"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0755'
  tags: [zeroclaw, config]

- name: Create ZeroClaw config (Ollama)
  ansible.builtin.copy:
    dest: "{{ admin_home }}/.zeroclaw/config.toml"
    content: |
      # ZeroClaw config — point at local Ollama
      default_provider = "ollama"

      [providers.ollama]
      kind = "ollama"
      base_url = "http://127.0.0.1:11434"
      model = "qwen3.5:4b"
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: '0644'
  when: zeroclaw_version.rc != 0
  tags: [zeroclaw, config]

- name: Clean up temporary files
  ansible.builtin.file:
    path: /tmp/zeroclaw.tar.gz
    state: absent
  tags: [zeroclaw, cleanup]
