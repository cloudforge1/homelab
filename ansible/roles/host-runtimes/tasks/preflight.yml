---
- name: Skip host runtime management when disabled
  ansible.builtin.debug:
    msg: "host_runtime_enabled is false; nothing to do"
  when: not host_runtime_enabled | bool

- name: Stop host runtime role when disabled
  ansible.builtin.meta: end_host
  when: not host_runtime_enabled | bool

- name: Collect enabled env definitions
  ansible.builtin.set_fact:
    host_runtime_enabled_envs: >-
      {{
        host_runtime_python_env_matrix.envs
        | default([])
        | selectattr('enabled', 'equalto', true)
        | list
      }}
    host_runtime_enabled_env_names: >-
      {{
        host_runtime_python_env_matrix.envs
        | default([])
        | selectattr('enabled', 'equalto', true)
        | map(attribute='name')
        | list
      }}
    host_runtime_cuda_tag_requested: >-
      {{
        'cuda' in (ansible_run_tags | default([]))
        or 'host-runtimes-cuda' in (ansible_run_tags | default([]))
      }}
  changed_when: false

- name: Query NVIDIA GPU details
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - --query-gpu=name,compute_cap
      - --format=csv,noheader
  register: host_runtime_gpu_query
  changed_when: false
  failed_when: false
  check_mode: false

- name: Query host CUDA toolkit version
  ansible.builtin.shell: >-
    command -v nvcc >/dev/null 2>&1
    && nvcc --version | awk '/release/ {print $0}'
    || true
  args:
    executable: /bin/bash
  register: host_runtime_nvcc_query
  changed_when: false
  failed_when: false
  check_mode: false

- name: Derive detected host compatibility facts
  ansible.builtin.set_fact:
    host_runtime_detected_gpu_model: >-
      {{
        (host_runtime_gpu_query.stdout.split(',')[0] | trim)
        if host_runtime_gpu_query.rc == 0 and host_runtime_gpu_query.stdout | length > 0
        else (host_runtime_gpu_model | default('unknown'))
      }}
    host_runtime_detected_compute_capability: >-
      {{
        (host_runtime_gpu_query.stdout.split(',')[1] | trim)
        if host_runtime_gpu_query.rc == 0 and ',' in host_runtime_gpu_query.stdout
        else (host_runtime_gpu_compute_capability | default('0.0'))
      }}
    host_runtime_detected_cuda_toolkit: >-
      {{
        host_runtime_nvcc_query.stdout
        | regex_search('release ([0-9]+\.[0-9]+)', '\1')
        | default('', true)
      }}
  changed_when: false

- name: Assert wrapper and Conda prefixes are configured
  ansible.builtin.assert:
    that:
      - host_runtime_root | length > 0
      - host_runtime_wrapper_dir | length > 0
      - host_runtime_conda.install_prefix | length > 0
      - host_runtime_conda.init_shells | bool == false
    fail_msg: Host runtime root, wrapper dir, and Conda prefix must be configured; shell init mutation is not allowed by default.

- name: Assert enabled env names are unique
  ansible.builtin.assert:
    that:
      - host_runtime_enabled_env_names | length == (host_runtime_enabled_env_names | unique | length)
    fail_msg: Duplicate enabled env names detected in host_runtime_python_env_matrix.envs.

- name: Assert enabled envs declare validation commands
  ansible.builtin.assert:
    that:
      - item.validation is defined
      - item.validation | length > 0
    fail_msg: "Env {{ item.name }} must define at least one validation command."
  loop: "{{ host_runtime_enabled_envs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert enabled envs are marked supported
  ansible.builtin.assert:
    that:
      - item.supported | default(true) | bool
    fail_msg: >-
      Env {{ item.name }} is disabled by policy: {{ item.reason | default('unsupported on this host/runtime policy') }}
  loop: "{{ host_runtime_enabled_envs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Assert destructive env recreation is explicitly allowed
  ansible.builtin.assert:
    that:
      - host_runtime_allow_destructive | bool
    fail_msg: >-
      Env recreation was requested for {{ item.name }}, but host_runtime_allow_destructive is false.
  loop: >-
    {{
      host_runtime_python_env_matrix.envs
      | default([])
      | selectattr('recreate', 'defined')
      | selectattr('recreate', 'equalto', true)
      | list
    }}
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (
      host_runtime_python_env_matrix.envs
      | default([])
      | selectattr('recreate', 'defined')
      | selectattr('recreate', 'equalto', true)
      | list
      | length
    ) > 0

- name: Assert AVX2 is available for envs that require it
  ansible.builtin.assert:
    that:
      - host_runtime_cpu_supports_avx2 | default(false) | bool or ('avx2' in (ansible_processor_flags | default([])))
    fail_msg: "Env {{ item.name }} requires AVX2, but this host does not expose it."
  loop: >-
    {{
      host_runtime_enabled_envs
      | selectattr('constraints.requires_avx2', 'defined')
      | selectattr('constraints.requires_avx2', 'equalto', true)
      | list
    }}
  loop_control:
    label: "{{ item.name }}"

- name: Assert vLLM GPU envs are blocked on Pascal host
  ansible.builtin.assert:
    that:
      - item.accelerator | default('cpu') == 'cpu' or host_runtime_vllm_gpu_supported | default(false) | bool
    fail_msg: >-
      Env {{ item.name }} requests accelerator {{ item.accelerator }}, but cf0 is Pascal / compute capability {{ host_runtime_detected_compute_capability }} and vLLM GPU mode is hard-blocked.
  loop: >-
    {{
      host_runtime_enabled_envs
      | selectattr('framework', 'equalto', 'vllm')
      | list
    }}
  loop_control:
    label: "{{ item.name }}"

- name: Assert optional vLLM service backend remains CPU-only on cf0
  ansible.builtin.assert:
    that:
      - host_runtime_inference_services.vllm.backend | default('cpu') == 'cpu'
    fail_msg: cf0 is Pascal / SM 6.1; host_runtime_inference_services.vllm.backend must stay cpu.
  when: host_runtime_inference_services.vllm.enabled | default(false) | bool

- name: Assert CUDA mutation requires explicit tag and variable
  ansible.builtin.assert:
    that:
      - host_runtime_cuda.allow_mutation | bool
      - host_runtime_cuda_tag_requested | bool
      - host_runtime_cuda.packages | default([]) | length > 0
    fail_msg: >-
      Host CUDA mode {{ host_runtime_cuda.mode }} requires host_runtime_cuda.allow_mutation=true,
      explicit --tags cuda, and at least one package in host_runtime_cuda.packages.
  when: host_runtime_cuda.mode in ['install', 'pin']

- name: Display host runtime preflight summary
  ansible.builtin.debug:
    msg:
      - "Host runtime root: {{ host_runtime_root }}"
      - "Conda prefix: {{ host_runtime_conda.install_prefix }}"
      - "GPU: {{ host_runtime_detected_gpu_model }}"
      - "Compute capability: {{ host_runtime_detected_compute_capability }}"
      - "Detected CUDA toolkit: {{ host_runtime_detected_cuda_toolkit | default('not found') }}"
      - "Enabled envs: {{ host_runtime_enabled_env_names | join(', ') if host_runtime_enabled_env_names | length > 0 else 'none' }}"
  changed_when: false