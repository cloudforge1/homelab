---
# cf0 CLI Tools Playbook
#
# Installs host-native CLI tooling only:
#   - fnm + Node.js 22 (replaces NodeSource APT install)
#   - Rust / ZeroClaw / Claude Code / MetaClaw / uv / Gstack / docling-serve
#   - Terminal-first tools: hstr, snitch, fzf, ripgrep, fd, bat, eza,
#     zoxide, btop, lazygit
#
# Docker-hosted applications stay in compose-managed roles.

- name: Install cf0 CLI Tools
  hosts: cf0
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  vars:
    local_user: "{{ admin_user }}"
    local_home: "{{ admin_home }}"
    log_file: "{{ local_home }}/.local/state/cf0-llm-tools.log"
    local_bin_dir: "{{ local_home }}/.local/bin"
    fnm_install_dir: "{{ local_home }}/.local/share/fnm"
    shell_tools_init_file: "{{ local_home }}/.config/cloudforge/shell-tools.sh"

  tasks:
    - name: Ensure local state and bin directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ local_user }}"
        group: "{{ local_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ log_file | dirname }}", mode: "0755" }
        - { path: "{{ local_bin_dir }}", mode: "0755" }
        - { path: "{{ shell_tools_init_file | dirname }}", mode: "0755" }
      tags: [setup]

    - name: Install terminal productivity tools from APT
      ansible.builtin.apt:
        name: "{{ terminal_tools_apt_packages }}"
        state: present
        update_cache: yes
      when: enable_terminal_tools | default(true) | bool
      tags: [terminal-tools, apt-tools]

    - name: Expose fd binary under canonical name
      ansible.builtin.file:
        src: /usr/bin/fdfind
        dest: /usr/local/bin/fd
        state: link
      when:
        - enable_terminal_tools | default(true) | bool
        - ansible_facts.os_family == 'Debian'
      tags: [terminal-tools, apt-tools]

    - name: Expose bat binary under canonical name
      ansible.builtin.file:
        src: /usr/bin/batcat
        dest: /usr/local/bin/bat
        state: link
      when:
        - enable_terminal_tools | default(true) | bool
        - ansible_facts.os_family == 'Debian'
      tags: [terminal-tools, apt-tools]

    - name: Check if rustc exists
      ansible.builtin.command: rustc --version
      register: rust_version
      failed_when: false
      changed_when: false
      tags: [rust]

    - name: Install Rust via rustup
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: "{{ local_home }}/.cargo/bin/rustc"
      become_user: "{{ local_user }}"
      when: enable_rust | default(enable_zeroclaw | default(true)) | bool and rust_version.rc != 0
      tags: [rust]

    - name: Check if fnm exists
      ansible.builtin.command: "{{ fnm_install_dir }}/fnm --version"
      register: fnm_version
      failed_when: false
      changed_when: false
      become_user: "{{ local_user }}"
      tags: [nodejs, fnm]

    - name: Install fnm
      ansible.builtin.shell: |
        curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "{{ fnm_install_dir }}" --skip-shell
      args:
        creates: "{{ fnm_install_dir }}/fnm"
      become_user: "{{ local_user }}"
      when: enable_fnm | default(true) | bool and fnm_version.rc != 0
      tags: [nodejs, fnm]

    - name: Install managed shell tools init snippet
      ansible.builtin.copy:
        dest: "{{ shell_tools_init_file }}"
        owner: "{{ local_user }}"
        group: "{{ local_user }}"
        mode: '0644'
        content: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.local/share/fnm:$PATH"

          if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env --use-on-cd --shell bash)"
          fi

          if command -v zoxide >/dev/null 2>&1; then
              eval "$(zoxide init bash)"
          fi

          if command -v hstr >/dev/null 2>&1; then
              alias hh='hstr'
          fi
      tags: [shell, terminal-tools, nodejs]

    - name: Source managed shell tools init from bashrc
      ansible.builtin.blockinfile:
        path: "{{ local_home }}/.bashrc"
        owner: "{{ local_user }}"
        group: "{{ local_user }}"
        create: true
        marker: "# {mark} CLOUDFORGE SHELL TOOLS"
        block: |
          [ -f "$HOME/.config/cloudforge/shell-tools.sh" ] && . "$HOME/.config/cloudforge/shell-tools.sh"
      become_user: "{{ local_user }}"
      tags: [shell, terminal-tools, nodejs]

    - name: Check if fnm-managed Node.js version exists
      ansible.builtin.shell: |
        export PATH="{{ fnm_install_dir }}:$PATH"
        eval "$(fnm env --shell bash)"
        fnm list | grep -Eq 'v{{ fnm_node_version }}([.]|$)'
      register: fnm_node_version_check
      failed_when: false
      changed_when: false
      become_user: "{{ local_user }}"
      when: enable_fnm | default(true) | bool
      tags: [nodejs, fnm]

    - name: Install default Node.js version with fnm
      ansible.builtin.shell: |
        export PATH="{{ fnm_install_dir }}:$PATH"
        eval "$(fnm env --shell bash)"
        fnm install {{ fnm_node_version }}
        fnm default {{ fnm_node_version }}
      become_user: "{{ local_user }}"
      when:
        - enable_fnm | default(true) | bool
        - fnm_node_version_check.rc != 0
      tags: [nodejs, fnm]

    - name: Update npm under fnm-managed Node.js
      ansible.builtin.shell: |
        export PATH="{{ fnm_install_dir }}:$PATH"
        eval "$(fnm env --shell bash)"
        fnm use {{ fnm_node_version }} >/dev/null
        npm install -g npm@latest
      become_user: "{{ local_user }}"
      changed_when: false
      when: enable_fnm | default(true) | bool
      tags: [nodejs, fnm]

    - name: Check if snitch exists
      ansible.builtin.command: "{{ local_bin_dir }}/snitch --version"
      register: snitch_version
      failed_when: false
      changed_when: false
      become_user: "{{ local_user }}"
      when: enable_snitch | default(true) | bool
      tags: [terminal-tools, snitch]

    - name: Install snitch via upstream installer
      ansible.builtin.shell: |
        curl -sSL https://raw.githubusercontent.com/karol-broda/snitch/master/install.sh | INSTALL_DIR="{{ local_bin_dir }}" sh
      args:
        creates: "{{ local_bin_dir }}/snitch"
      become_user: "{{ local_user }}"
      when:
        - enable_snitch | default(true) | bool
        - snitch_version.rc != 0
      tags: [terminal-tools, snitch]

    - name: Check if ZeroClaw is installed
      ansible.builtin.command: zeroclaw --version
      register: zeroclaw_version
      failed_when: false
      changed_when: false
      when: enable_zeroclaw | default(true) | bool
      tags: [zeroclaw]

    - name: Install ZeroClaw
      block:
        - name: Download and install ZeroClaw binary
          ansible.builtin.get_url:
            url: "https://github.com/zeroclaw-labs/zeroclaw/releases/download/v0.5.5/zeroclaw-x86_64-unknown-linux-gnu.tar.gz"
            dest: /tmp/zeroclaw.tar.gz
            mode: '0644'

        - name: Extract ZeroClaw
          ansible.builtin.unarchive:
            src: /tmp/zeroclaw.tar.gz
            dest: /tmp
            remote_src: yes

        - name: Install ZeroClaw to /usr/local/bin
          ansible.builtin.copy:
            src: /tmp/zeroclaw
            dest: /usr/local/bin/zeroclaw
            mode: '0755'
            remote_src: yes

        - name: Create ZeroClaw config directory
          ansible.builtin.file:
            path: "{{ local_home }}/.zeroclaw"
            state: directory
            owner: "{{ local_user }}"
            group: "{{ local_user }}"
            mode: '0755'

        - name: Create ZeroClaw config
          ansible.builtin.copy:
            dest: "{{ local_home }}/.zeroclaw/config.toml"
            owner: "{{ local_user }}"
            group: "{{ local_user }}"
            mode: '0644'
            content: |
              default_provider = "ollama"

              [providers.ollama]
              kind = "ollama"
              base_url = "http://127.0.0.1:11434"
              model = "qwen3.5:4b"
      when:
        - enable_zeroclaw | default(true) | bool
        - zeroclaw_version.rc != 0
      tags: [zeroclaw]

    - name: Check if Claude Code is installed
      ansible.builtin.shell: |
        export PATH="{{ fnm_install_dir }}:$PATH"
        eval "$(fnm env --shell bash)"
        fnm use {{ fnm_node_version }} >/dev/null
        claude --version
      register: claude_version
      failed_when: false
      changed_when: false
      become_user: "{{ local_user }}"
      when: enable_claude_code | default(true) | bool
      tags: [claude, npm-tools]

    - name: Install Claude Code via npm
      ansible.builtin.shell: |
        export PATH="{{ fnm_install_dir }}:$PATH"
        eval "$(fnm env --shell bash)"
        fnm use {{ fnm_node_version }} >/dev/null
        npm install -g @anthropic-ai/claude-code
      become_user: "{{ local_user }}"
      when:
        - enable_claude_code | default(true) | bool
        - claude_version.rc != 0
      tags: [claude, npm-tools]

    - name: Check if MetaClaw is installed
      ansible.builtin.command: metaclaw --version
      register: metaclaw_version
      failed_when: false
      changed_when: false
      when: enable_metaclaw | default(true) | bool
      tags: [metaclaw, pip-tools]

    - name: Install MetaClaw via pip
      ansible.builtin.pip:
        name: metaclaw
        state: present
        extra_args: --break-system-packages
      when:
        - enable_metaclaw | default(true) | bool
        - metaclaw_version.rc != 0
      tags: [metaclaw, pip-tools]

    - name: Check if uv is installed
      ansible.builtin.command: uv --version
      register: uv_version
      failed_when: false
      changed_when: false
      become_user: "{{ local_user }}"
      when: enable_uv | default(true) | bool
      tags: [uv, pip-tools]

    - name: Install uv via official installer
      ansible.builtin.shell: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        creates: "{{ local_bin_dir }}/uv"
      become_user: "{{ local_user }}"
      when:
        - enable_uv | default(true) | bool
        - uv_version.rc != 0
      tags: [uv, pip-tools]

    - name: Check if Gstack is installed
      ansible.builtin.shell: |
        export PATH="{{ fnm_install_dir }}:$PATH"
        eval "$(fnm env --shell bash)"
        fnm use {{ fnm_node_version }} >/dev/null
        gstack --version
      register: gstack_version
      failed_when: false
      changed_when: false
      become_user: "{{ local_user }}"
      when: enable_gstack | default(false) | bool
      tags: [gstack, npm-tools]

    - name: Install Gstack via npm
      ansible.builtin.shell: |
        export PATH="{{ fnm_install_dir }}:$PATH"
        eval "$(fnm env --shell bash)"
        fnm use {{ fnm_node_version }} >/dev/null
        npm install -g gstack
      become_user: "{{ local_user }}"
      when:
        - enable_gstack | default(false) | bool
        - gstack_version.rc != 0
      tags: [gstack, npm-tools]

    - name: Check docling-serve service state
      ansible.builtin.systemd:
        name: docling-serve
      register: docling_service
      failed_when: false
      when: enable_docling | default(true) | bool
      tags: [docling, systemd]

    - name: Install docling-serve package
      ansible.builtin.pip:
        name: docling-serve
        state: present
        extra_args: --break-system-packages
      when:
        - enable_docling | default(true) | bool
        - docling_service.status is not defined or docling_service.status.ActiveState != 'active'
      tags: [docling, systemd]

    - name: Resolve docling-serve binary path
      ansible.builtin.command: which docling-serve
      register: docling_bin
      changed_when: false
      failed_when: false
      when: enable_docling | default(true) | bool
      tags: [docling, systemd]

    - name: Create docling-serve systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/docling-serve.service
        mode: '0644'
        content: |
          [Unit]
          Description=Docling document conversion REST server
          After=network.target

          [Service]
          Type=simple
          User={{ local_user }}
          ExecStart={{ docling_bin.stdout | default('/usr/local/bin/docling-serve') }} run --host 0.0.0.0 --port {{ docling_port | default(5001) }}
          Restart=on-failure
          RestartSec=10
          Environment=PATH={{ local_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin

          [Install]
          WantedBy=multi-user.target
      notify: reload systemd
      when: enable_docling | default(true) | bool
      tags: [docling, systemd]

    - name: Enable and start docling-serve
      ansible.builtin.systemd:
        name: docling-serve
        state: started
        enabled: true
        daemon_reload: true
      when: enable_docling | default(true) | bool
      tags: [docling, systemd]

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

  post_tasks:
    - name: Display CLI tooling summary
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════"
          - "  cf0 CLI Tooling Complete"
          - "═══════════════════════════════════════════════════════════"
          - "  Node manager: fnm (Node {{ fnm_node_version }})"
          - "  Terminal tools: hstr, snitch, fzf, ripgrep, fd, bat, eza, zoxide, btop, lazygit"
          - "  CLI agents: Claude Code, ZeroClaw, MetaClaw, uv{{ ', Gstack' if (enable_gstack | default(false) | bool) else '' }}"
          - "  docling-serve: {{ 'http://cf0:' ~ (docling_port | default(5001)) if (enable_docling | default(true) | bool) else 'disabled' }}"
          - "═══════════════════════════════════════════════════════════"
      tags: [always]
