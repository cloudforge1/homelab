---
# cf0 CLI Tools Playbook
#
# Wraps the cli-tools role for host-native CLI tooling only.
# Docker-hosted applications stay in compose-managed roles.
#
# Usage:
#   ansible-playbook playbooks/llm-tools.yml
#   ansible-playbook playbooks/llm-tools.yml --check --diff
#   ansible-playbook playbooks/llm-tools.yml --tags cli-tools

- name: Install cf0 CLI Tools
  hosts: cf0
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: cli-tools
      tags: [cli-tools]
