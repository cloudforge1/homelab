---
# Docker Compose Deployment Playbook
# Manages Docker Compose stacks deployment and lifecycle

- name: Deploy Docker Compose stacks
  hosts: homelab
  become: true
  gather_facts: false

  vars:
    compose_action: "up"  # up, down, restart, pull
    compose_build: false
    compose_remove_orphans: true
    compose_project: "{{ compose_project | default('cf-core') }}"
    compose_files: "{{ compose_files | default(['docker-compose.yml']) }}"

  tasks:
    - name: Ensure compose directory exists
      ansible.builtin.file:
        path: "{{ compose_path }}"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_group }}"
        mode: '0755'
      tags: [compose, deploy]

    - name: Ensure shared homelab network exists
      community.docker.docker_network:
        name: "{{ docker_network_name }}"
        state: present
      when: compose_action in ['up', 'restart']
      tags: [compose, network]

    - name: Pull latest images (optional)
      ansible.builtin.command:
        argv: >-
          {{
            ['docker', 'compose', '--project-name', compose_project]
            + (compose_files | map('regex_replace', '^(.*)$', '-f') | list | zip(compose_files) | map('flatten') | list | flatten)
            + ['pull']
          }}
      when: compose_action == 'pull'
      changed_when: true
      tags: [compose, pull]

    - name: Deploy compose stacks
      community.docker.docker_compose_v2:
        project_src: "{{ compose_path }}"
        project_name: "{{ compose_project }}"
        files: "{{ compose_files }}"
        state: present
        build: "{{ 'always' if compose_build | bool else 'never' }}"
        remove_orphans: "{{ compose_remove_orphans }}"
      when: compose_action == 'up'
      tags: [compose, deploy]

    - name: Restart compose stacks
      community.docker.docker_compose_v2:
        project_src: "{{ compose_path }}"
        project_name: "{{ compose_project }}"
        files: "{{ compose_files }}"
        state: restarted
        remove_orphans: "{{ compose_remove_orphans }}"
      when: compose_action == 'restart'
      tags: [compose, deploy]

    - name: Stop compose stacks
      community.docker.docker_compose_v2:
        project_src: "{{ compose_path }}"
        project_name: "{{ compose_project }}"
        files: "{{ compose_files }}"
        state: absent
      when: compose_action == 'down'
      tags: [compose, stop]

    - name: Prune unused Docker resources
      community.docker.docker_prune:
        containers: true
        images: "{{ docker_prune_images }}"
        volumes: "{{ docker_prune_volumes }}"
        networks: true
      tags: [compose, cleanup]

    - name: Health check for services
      ansible.builtin.uri:
        url: "http://localhost:{{ item.port }}{{ item.path | default('/') }}"
        status_code: "{{ item.status_code | default([200, 301, 302]) }}"
        timeout: 10
      loop: "{{ compose_services | default([]) }}"
      register: health_check_result
      failed_when: false
      when: compose_action in ['up', 'restart']
      tags: [compose, healthcheck]

    - name: Display health check results
      ansible.builtin.debug:
        msg: |
          Service: {{ item.item.service }}
          Status: {{ '✓ Healthy' if item.status in [200, 301, 302] else '✗ Unhealthy' }}
      loop: "{{ health_check_result.results | default([]) }}"
      when: health_check_result.results is defined
      tags: [compose, healthcheck]
