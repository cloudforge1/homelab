---
# Global variables for cf0 homelab
# Hardware: i9-9900K, 107GB RAM, GTX 1060 6GB

# System settings
timezone: UTC
locale: en_US.UTF-8

# User settings
admin_user: r
admin_group: r
admin_home: /home/r

# Hardware
gpu_enabled: true
gpu_count: all
ollama_num_parallel: 2
ollama_keep_alive: 30m
ollama_max_loaded_models: 3
ollama_flash_attention: 1
ollama_num_threads: 14

# Docker settings
docker_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2

docker_daemon_options:
  storage-driver: overlay2
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"

# Network
bandwidth_limit: "50mbit"
nic_name: eno1

# ===================================================================
# COMPOSE STACK VARIABLES
# ===================================================================

# ── OpenRAG ─────────────────────────────────────────────────────────
openrag_version: latest
opensearch_password: "CCG04fuFpX8fFcl26JaWA1!"
opensearch_host: opensearch
opensearch_port: 9200
opensearch_username: admin
opensearch_index_name: documents
langflow_auto_login: true
langflow_superuser: admin
langflow_superuser_password: "CCG04fuFpX8fFcl26JaW"
langflow_workers: 1
frontend_port: 3000

# ── Serena MCP ──────────────────────────────────────────────────────
serena_port: 9121
serena_dashboard_port: 24282
serena_version: main
serena_context: ide
serena_projects_host_root: /home/r
serena_projects_container_root: /workspaces/home-r
serena_config_host_root: /home/r/serena-config

# ── PostgreSQL (tools) ──────────────────────────────────────────────
tools_pg_user: tools
tools_pg_password: tools_dev_2025
tools_pg_db: tools_db

# ── Ollama Model Sync ───────────────────────────────────────────────
model_sync_timeout_secs: 1800
enable_model_qwen35_9b: true
enable_model_qwen35_122b: false
enable_model_nemotron_3_super: false
enable_model_qwen3_coder_next: false
enable_model_devstral_2: false
enable_model_nemotron_cascade_2: false
enable_model_nemotron_3_nano_30b: false
enable_model_qwen3_vl_30b: false
enable_model_qwen3_vl_8b: false
enable_model_lfm2_24b: false
enable_model_glm_4_7_flash: false
enable_model_qwen3_next: false
enable_model_gpt_oss_20b: false
enable_model_olmo_3_1_32b: false

# ── Feature Toggles (cf0-llm-tools.sh) ──────────────────────────────
enable_zeroclaw: true
enable_mindsdb: true
enable_cognee: true
enable_flowise: true
enable_unsloth: true
enable_claude_code: true
enable_metaclaw: true
enable_uv: true
enable_gstack: true
enable_onyx: true

# ── Scrutiny ────────────────────────────────────────────────────────
scrutiny_port: 7786
scrutiny_devices:
  - /dev/sda
  - /dev/sdb
  - /dev/sdc
  - /dev/sdd
  - /dev/sde
  - /dev/sdf
  - /dev/sdg

# ── OpenSpace ───────────────────────────────────────────────────────
openspace_port: 7788
openspace_memory_limit: 500M
openspace_cpu_limit: "1.0"

# ===================================================================
# HOST RUNTIMES
# ===================================================================

host_runtime_enabled: true
host_runtime_root: "{{ homelab_base_path }}/host-runtimes"
host_runtime_owner: "{{ admin_user }}"
host_runtime_group: "{{ admin_group }}"
host_runtime_wrapper_dir: /usr/local/bin
host_runtime_allow_destructive: false
host_runtime_validation_enabled: true

host_runtime_cuda:
  enabled: true
  mode: detect-only
  allow_mutation: false
  toolkit_version: "12.6"
  packages: []
  manage_symlink: false
  validate_commands:
    - nvidia-smi
    - nvcc --version

host_runtime_conda:
  enabled: true
  distribution: Miniforge3
  installer_url: https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
  install_prefix: "{{ host_runtime_root }}/miniforge3"
  init_shells: false
  auto_update_base: false
  shared_channels:
    - conda-forge
    - defaults

host_runtime_python_env_matrix:
  default_python: "3.10"
  envs:
    - name: py310pp26
      enabled: true
      supported: true
      python: "3.10"
      framework: paddle
      framework_version: "2.6.2"
      accelerator: cpu
      install_method: pip
      conda_packages: []
      pip_packages:
        - paddlepaddle==2.6.2
      extra_index_urls: []
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import paddle; print(paddle.__version__)"

    - name: py310pp30
      enabled: true
      supported: true
      python: "3.10"
      framework: paddle
      framework_version: "3.0.0"
      accelerator: cpu
      install_method: pip
      conda_packages: []
      pip_packages:
        - paddlepaddle==3.0.0
      extra_index_urls: []
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import paddle; print(paddle.__version__)"

    - name: py310pt211cpu
      enabled: true
      supported: true
      python: "3.10"
      framework: pytorch
      framework_version: "2.1.1"
      accelerator: cpu
      install_method: pip
      conda_packages: []
      pip_packages:
        - torch==2.1.1
        - torchvision==0.16.1
        - torchaudio==2.1.1
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import torch; print(torch.__version__); print(torch.cuda.is_available())"

    - name: py310pt211cu126
      enabled: false
      supported: false
      reason: Torch 2.1.1 does not publish a cu126 wheel set; keep disabled until the operator selects a compatible torch/CUDA pairing.
      python: "3.10"
      framework: pytorch
      framework_version: "2.1.1"
      accelerator: cu126
      install_method: pip
      conda_packages: []
      pip_packages: []
      extra_index_urls: []
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version

    - name: py311pt260cu126
      enabled: false
      supported: true
      python: "3.11"
      framework: pytorch
      framework_version: "2.6.0"
      accelerator: cu126
      install_method: pip
      conda_packages: []
      pip_packages:
        - torch==2.6.0
        - torchvision==0.21.0
        - torchaudio==2.6.0
      extra_index_urls:
        - https://download.pytorch.org/whl/cu126
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import torch; print(torch.__version__); print(torch.cuda.is_available())"

    - name: py310vllmcpu
      enabled: false
      supported: true
      python: "3.10"
      framework: vllm
      framework_version: "0.18.0"
      accelerator: cpu
      install_method: command
      conda_packages: []
      pip_packages:
        - uv>=0.8.0
      extra_index_urls: []
      system_packages:
        - libtcmalloc-minimal4
      env_vars:
        VLLM_TARGET_DEVICE: cpu
        VLLM_CPU_KVCACHE_SPACE: "40"
        VLLM_CPU_NUM_OF_RESERVED_CPU: "2"
      dynamic_ld_preload: true
      post_create_commands:
        - python -m pip install --upgrade pip
        - uv pip install https://github.com/vllm-project/vllm/releases/download/v0.18.0/vllm-0.18.0+cpu-cp38-abi3-manylinux_2_35_x86_64.whl --torch-backend cpu
      constraints:
        requires_avx2: true
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import vllm; print(vllm.__version__)"

host_runtime_inference_services:
  vllm:
    enabled: false
    env_name: py310vllmcpu
    backend: cpu
    host: 127.0.0.1
    port: 8000
    model: facebook/opt-125m
    kv_cache_gb: 40
    reserved_cpus: 2
    systemd_enabled: false
    extra_args:
      - --dtype=bfloat16
