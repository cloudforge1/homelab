# ===================================================================
# HOST RUNTIMES
# ===================================================================

host_runtime_enabled: true
host_runtime_root: "{{ homelab_base_path }}/host-runtimes"
host_runtime_owner: "{{ admin_user }}"
host_runtime_group: "{{ admin_group }}"
host_runtime_wrapper_dir: /usr/local/bin
host_runtime_allow_destructive: false
host_runtime_validation_enabled: true

host_runtime_cuda:
  enabled: true
  mode: detect-only
  allow_mutation: false
  toolkit_version: "12.6"
  packages: []
  manage_symlink: false
  validate_commands:
    - nvidia-smi
    - nvcc --version

host_runtime_conda:
  enabled: true
  distribution: Miniforge3
  installer_url: https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
  install_prefix: "{{ host_runtime_root }}/miniforge3"
  init_shells: false
  auto_update_base: false
  shared_channels:
    - conda-forge
    - defaults

host_runtime_python_env_matrix:
  default_python: "3.10"
  envs:
    - name: py310pp26
      enabled: true
      supported: true
      python: "3.10"
      framework: paddle
      framework_version: "2.6.2"
      accelerator: cpu
      install_method: pip
      conda_packages: []
      pip_packages:
        - paddlepaddle==2.6.2
      extra_index_urls: []
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import paddle; print(paddle.__version__)"

    - name: py310pp30
      enabled: true
      supported: true
      python: "3.10"
      framework: paddle
      framework_version: "3.0.0"
      accelerator: cpu
      install_method: pip
      conda_packages: []
      pip_packages:
        - paddlepaddle==3.0.0
      extra_index_urls: []
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import paddle; print(paddle.__version__)"

    - name: py310pt211cpu
      enabled: true
      supported: true
      python: "3.10"
      framework: pytorch
      framework_version: "2.1.1"
      accelerator: cpu
      install_method: pip
      conda_packages: []
      pip_packages:
        - torch==2.1.1
        - torchvision==0.16.1
        - torchaudio==2.1.1
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import torch; print(torch.__version__); print(torch.cuda.is_available())"

    - name: py310pt211cu126
      enabled: false
      supported: false
      reason: Torch 2.1.1 does not publish a cu126 wheel set; keep disabled until the operator selects a compatible torch/CUDA pairing.
      python: "3.10"
      framework: pytorch
      framework_version: "2.1.1"
      accelerator: cu126
      install_method: pip
      conda_packages: []
      pip_packages: []
      extra_index_urls: []
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version

    - name: py311pt260cu126
      enabled: false
      supported: true
      python: "3.11"
      framework: pytorch
      framework_version: "2.6.0"
      accelerator: cu126
      install_method: pip
      conda_packages: []
      pip_packages:
        - torch==2.6.0
        - torchvision==0.21.0
        - torchaudio==2.6.0
      extra_index_urls:
        - https://download.pytorch.org/whl/cu126
      env_vars: {}
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import torch; print(torch.__version__); print(torch.cuda.is_available())"

    - name: py310vllmcpu
      enabled: false
      supported: true
      python: "3.10"
      framework: vllm
      framework_version: "0.18.0"
      accelerator: cpu
      install_method: command
      conda_packages: []
      pip_packages:
        - uv>=0.8.0
      extra_index_urls: []
      system_packages:
        - libtcmalloc-minimal4
      env_vars:
        VLLM_TARGET_DEVICE: cpu
        VLLM_CPU_KVCACHE_SPACE: "40"
        VLLM_CPU_NUM_OF_RESERVED_CPU: "2"
      dynamic_ld_preload: true
      post_create_commands:
        - python -m pip install --upgrade pip
        - uv pip install https://github.com/vllm-project/vllm/releases/download/v0.18.0/vllm-0.18.0+cpu-cp38-abi3-manylinux_2_35_x86_64.whl --torch-backend cpu
      constraints:
        requires_avx2: true
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import vllm; print(vllm.__version__)"

    # ── AI Tools Libraries (shared) ──────────────────────────────────
    # Purpose: Common AI/ML libraries for CLI tools (Heretic, mergekit, etc.)
    # Strategy: Separate env to avoid bloating py310pt211cpu with heavy deps
    # ⚠️ BLOCKER note: vLLM GPU mode hard-blocked (SM 6.1 < SM 8.0)
    - name: py310ai-libs
      enabled: "{{ enable_conda_ai_libs == 'stopped' or enable_conda_ai_libs == 'running' }}"
      supported: true
      python: "3.10"
      framework: ai-libs
      framework_version: "2026.04"
      accelerator: cpu
      install_method: pip
      conda_packages:
        - pip
      pip_packages:
        - torch==2.1.1
        - torchvision==0.16.1
        - torchaudio==2.1.1
        - transformers>=4.40.0
        - accelerate>=0.30.0
        - bitsandbytes>=0.43.0
        - safetensors>=0.4.0
        - peft>=0.11.0
        - optuna>=3.6.0
        - scipy>=1.11.0
        - numpy>=1.24.0
        - huggingface-hub>=0.23.0
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars:
        TRANSFORMERS_CACHE: "{{ host_runtime_root }}/envs/py310ai-libs/.cache/huggingface"
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import torch, transformers, bitsandbytes; print('AI libs ready')"

    # ── AirLLM (low VRAM LLM inference) ──────────────────────────────
    # Purpose: Run 70B-405B models on 4GB GPU via layer streaming
    # Strategy: Isolated env due to large model cache and specialized deps
    # HW: CPU mode works on i9-9900K but very slow. 107GB RAM handles models.
    - name: py310airllm
      enabled: "{{ enable_conda_airllm == 'stopped' or enable_conda_airllm == 'running' }}"
      supported: true
      python: "3.10"
      framework: airllm
      framework_version: "2.12.0"
      accelerator: cpu
      install_method: pip
      conda_packages:
        - pip
      pip_packages:
        - torch==2.1.1
        - transformers>=4.40.0
        - accelerate>=0.30.0
        - safetensors>=0.4.0
        - bitsandbytes>=0.43.0
        - airllm>=2.12.0
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars:
        AIRLLM_CACHE_DIR: "{{ host_runtime_root }}/envs/py310airllm/.cache/airllm"
        TRANSFORMERS_CACHE: "{{ host_runtime_root }}/envs/py310airllm/.cache/huggingface"
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "from airllm import AirLLM; print('AirLLM ready')"

    # ── Heretic (LLM decensor) ───────────────────────────────────────
    # Purpose: Auto-uncensor LLMs via abliteration + TPE optimizer
    # Strategy: Uses py310ai-libs base + heretic-specific packages
    # HW: POSSIBLE — 6GB VRAM tight for 8B models; bitsandbytes 4-bit helps.
    - name: py310heretic
      enabled: "{{ enable_conda_heretic == 'stopped' or enable_conda_heretic == 'running' }}"
      supported: true
      python: "3.10"
      framework: heretic
      framework_version: "1.0.0"
      accelerator: cpu
      install_method: pip
      conda_packages:
        - pip
      pip_packages:
        - torch==2.1.1
        - transformers>=4.40.0
        - accelerate>=0.30.0
        - bitsandbytes>=0.43.0
        - optuna>=3.6.0
        - safetensors>=0.4.0
        - peft>=0.11.0
        - heretic>=1.0.0
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars:
        HERETIC_CACHE_DIR: "{{ host_runtime_root }}/envs/py310heretic/.cache/heretic"
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import heretic; print('Heretic ready')"

    # ── mergekit (LLM merging) ───────────────────────────────────────
    # Purpose: Merge LLMs via SLERP, TIES, DARE, passthrough
    # Strategy: Uses py310ai-libs base + mergekit
    # HW: POSSIBLE — CPU-bound batch job; slow but functional with 107GB RAM.
    - name: py310mergekit
      enabled: "{{ enable_conda_mergekit == 'stopped' or enable_conda_mergekit == 'running' }}"
      supported: true
      python: "3.10"
      framework: mergekit
      framework_version: "0.0.5"
      accelerator: cpu
      install_method: pip
      conda_packages:
        - pip
      pip_packages:
        - torch==2.1.1
        - transformers>=4.40.0
        - accelerate>=0.30.0
        - safetensors>=0.4.0
        - mergekit>=0.0.5
        - tqdm
        - numpy
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars:
        MERGEKIT_CACHE_DIR: "{{ host_runtime_root }}/envs/py310mergekit/.cache/mergekit"
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import mergekit; print('mergekit ready')"

    # ── exllamav2 (VRAM optimization) ──────────────────────────────
    # Purpose: Optimized inference for 4-bit GGUF/EXL2 models
    # Strategy: Separate env due to specialized CUDA kernels
    # HW: POSSIBLE — works on Pascal but optimized for newer architectures.
    - name: py310exllama
      enabled: "{{ enable_conda_exllama == 'stopped' or enable_conda_exllama == 'running' }}"
      supported: true
      python: "3.10"
      framework: exllamav2
      framework_version: "0.2.0"
      accelerator: cpu
      install_method: pip
      conda_packages:
        - pip
      pip_packages:
        - torch==2.1.1
        - transformers>=4.40.0
        - accelerate>=0.30.0
        - safetensors>=0.4.0
        - exllamav2>=0.2.0
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars:
        EXLLAMA_CACHE_DIR: "{{ host_runtime_root }}/envs/py310exllama/.cache/exllama"
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import exllamav2; print('exllamav2 ready')"

    # ── abliteration (LLM uncensor) ─────────────────────────────────
    # Purpose: Uncensor LLMs without TransformerLens
    # Strategy: Simpler alternative to Heretic
    # HW: POSSIBLE — same 6GB VRAM constraint as Heretic.
    - name: py310abliteration
      enabled: "{{ enable_conda_abliteration == 'stopped' or enable_conda_abliteration == 'running' }}"
      supported: true
      python: "3.10"
      framework: abliteration
      framework_version: "1.0.0"
      accelerator: cpu
      install_method: pip
      conda_packages:
        - pip
      pip_packages:
        - torch==2.1.1
        - transformers>=4.40.0
        - accelerate>=0.30.0
        - bitsandbytes>=0.43.0
        - safetensors>=0.4.0
        - abliteration>=1.0.0
      extra_index_urls:
        - https://download.pytorch.org/whl/cpu
      env_vars:
        ABLITERATION_CACHE_DIR: "{{ host_runtime_root }}/envs/py310abliteration/.cache/abliteration"
      constraints:
        requires_avx2: false
        disallow_pascal: false
        requires_cuda_toolkit: false
      validation:
        - python --version
        - python -c "import abliteration; print('abliteration ready')"

host_runtime_inference_services:
  vllm:
    enabled: false
    env_name: py310vllmcpu
    backend: cpu
    host: 127.0.0.1
    port: 8000
    model: facebook/opt-125m
    kv_cache_gb: 40
    reserved_cpus: 2
    systemd_enabled: false
    extra_args:
      - --dtype=bfloat16
