---
# Global variables for cf0 homelab
# Hardware: i9-9900K, 107GB RAM, GTX 1060 6GB

# System settings
timezone: UTC
locale: en_US.UTF-8

# User settings
admin_user: r
admin_group: r
admin_home: /home/r

# Hardware
gpu_enabled: true
gpu_count: all
ollama_num_parallel: 2
ollama_keep_alive: 30m
ollama_max_loaded_models: 3
ollama_flash_attention: 1
ollama_num_threads: 14

# Docker settings
docker_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2

docker_daemon_options:
  storage-driver: overlay2
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"

# Network
bandwidth_limit: "50mbit"
nic_name: eno1

# ===================================================================
# COMPOSE STACK VARIABLES
# ===================================================================

