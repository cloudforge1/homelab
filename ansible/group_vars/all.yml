enable_flowise: false
enable_unsloth: false
enable_claude_code: true
enable_metaclaw: true
enable_uv: true
enable_gstack: false
enable_onyx: false
enable_docling: true
enable_fnm: true
enable_snitch: true
enable_terminal_tools: true

fnm_node_version: "22"
