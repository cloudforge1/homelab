milvus_version: v2.5.0
milvus_port: 19530
milvus_health_port: 9091
minio_version: latest
milvus_minio_access_key: minioadmin
milvus_minio_secret_key: minioadmin

# ===================================================================
# AI TOOLS (docker-compose.ai-tools.yml)
# Categories: OCR, Speech, TTS, Audio, Translation, Image, Code,
#             Gateway, Video, RAG, Email, Privacy, Memory, NSFW, Notable
#
# States: "running" | "stopped" | "disabled"
#   running  — Deploy + start (consumes RAM, binds port)
#   stopped  — Pull image + create container, keep stopped (0 RAM, 0 CPU)
#   disabled — Not deployed at all (default)
#
# Hardware: cf0 — i9-9900K (16t), 107GB RAM, GTX 1060 6GB (Pascal SM 6.1)
# HARD BLOCKERS on this hardware:
#   - vLLM GPU mode: requires SM 8.0+ (Ampere); Pascal SM 6.1 is blocked
#   - Rope (face swap): RTX/tensor core optimizations; Pascal is impractically slow
#   - kohya_ss (LoRA training): needs 8+ GB VRAM; 6GB is insufficient for SDXL
#   - Email tools (AnonAddy, SimpleLogin, Mailu): need port 25 unblocked + DNS/MX
# ===================================================================

# ── Document OCR & Understanding ────────────────────────────────────
# HW: All CPU-friendly. GLM-OCR needs LLM backend (use Ollama).
enable_glm_ocr: running
enable_paddle_ocr: stopped
enable_marker: stopped

# ── Speech-to-Text (Transcription) ─────────────────────────────────
# HW: All easy. Faster-Whisper/WhisperX fit 6GB VRAM; CPU mode works too.
enable_faster_whisper: stopped
enable_whisper_x: stopped
enable_funasr: stopped

# ── Text-to-Speech (TTS) ───────────────────────────────────────────
# HW: All CPU-only or lightweight. Piper = <100ms latency on CPU.
enable_piper: stopped
enable_kokoro_fastapi: stopped
enable_paddle_speech: stopped

# ── Audio Separation & Processing ──────────────────────────────────
# HW: Demucs/UVR5 run fine on CPU (107GB RAM handles models easily).
enable_demucs: stopped
enable_uvr5: stopped
enable_audiosep: stopped

# ── Translation ─────────────────────────────────────────────────────
# HW: All CPU-first. Lightweight models, no GPU needed.
enable_pdf_math_translate: stopped
enable_libre_translate: stopped
enable_argos_translate: stopped

# ── Image Generation ────────────────────────────────────────────────
# HW: POSSIBLE — SD 1.5 runs fine on 6GB; SDXL needs --lowvram flags.
# NOTE: ComfyUI is the most flexible backend for low-VRAM.
enable_comfyui: stopped
enable_fooocus: stopped
enable_swarmui: stopped

# ── Image Enhancement & Restoration ────────────────────────────────
# HW: All easy. Tile-based processing keeps VRAM low. Fits 6GB fine.
enable_real_esrgan: stopped
enable_gfpgan: stopped
enable_clarity_upscaler: stopped

# ── AI Code Assistant ──────────────────────────────────────────────
# HW: Aider/Continue route to Ollama (zero local inference).
# Tabby = POSSIBLE — small code models only, high latency on CPU.
enable_aider: stopped
enable_tabby: stopped

# ── LLM Gateway & Routing ──────────────────────────────────────────
# HW: All easy — pure proxy/observability, no ML inference.
enable_litellm: stopped
enable_langfuse: stopped
enable_infinity: stopped

# ── Video Download & Processing ────────────────────────────────────
# HW: All easy — no ML inference, just yt-dlp + ffmpeg.
enable_cobalt: stopped
enable_metube: stopped
enable_reclip: stopped

# ── RAG & Document Chat ────────────────────────────────────────────
# HW: All easy — route to existing Ollama + Qdrant/Chroma stack.
enable_privategpt: stopped
enable_anythingllm: stopped
enable_paperqa2: stopped

# ── Email Privacy ──────────────────────────────────────────────────
# ⚠️ BLOCKER: Need port 25 unblocked + DNS/MX/SSL setup.
enable_anonaddy: stopped
enable_simplelogin: stopped
enable_mailu: stopped

# ── Privacy & Anonymization ────────────────────────────────────────
# HW: Presidio/SecretScanner = easy (CPU). PII Detector uses Ollama.
enable_presidio: stopped
enable_secret_scanner: stopped
enable_pii_detector: stopped

# ── AI Memory & Cognitive ──────────────────────────────────────────
# HW: All easy — route to existing Ollama + Qdrant stack.
enable_mem0: stopped
enable_letta: stopped

# ── NSFW / 18+ Tools ───────────────────────────────────────────────
# FaceFusion/RVC/Applio/AnimateDiff: POSSIBLE on 6GB (inference OK, training slow)
# ⚠️ BLOCKER: Rope = RTX/tensor core optimized (Pascal too slow)
# ⚠️ BLOCKER: kohya_ss = LoRA training needs 8+ GB VRAM
enable_fusion: stopped
enable_rope: stopped               # BLOCKED: needs RTX tensor cores
enable_rvc: stopped
enable_applio: stopped
enable_bark: stopped
enable_kohya: stopped              # BLOCKED: needs 8+ GB VRAM for training
enable_animatediff: stopped
enable_deepfacelive: stopped       # Real-time deepfake for video calls
enable_roop_discontinued: stopped  # Original one-click face swap (forked to FaceFusion)
enable_moore_animateanyone: stopped # Pose-driven character animation
enable_magicanimate: stopped       # Densepose-guided human animation
enable_ai_toolkit: stopped         # Microsoft's LoRA training toolkit
enable_stability_matrix: stopped   # Package manager for SD UIs

# ── Also Notable (Optional) ────────────────────────────────────────
# HW: All easy or lightweight. Auto1111 runs SD 1.5 fine on 6GB.
enable_surya: stopped
enable_docling: stopped
enable_nougat: stopped             # PDF → Markdown (academic papers)
enable_whisper_cpp: stopped
enable_speechbrain: stopped        # Speech toolkit (ASR, TTS, speaker)
enable_coqui_tts: stopped           # TTS (no longer maintained but functional)
enable_edge_tts: stopped            # Zero-GPU TTS via Edge Online TTS API
enable_spleeter: stopped            # Audio stem separation (outdated by Demucs)
enable_invokeai: stopped            # SD image gen (polished, 27k stars)
enable_codeformer: stopped          # Face restoration (alternative to GFPGAN)
enable_swinir: stopped              # Image restoration (alternative to ESRGAN)
enable_sglang: stopped              # LLM serving (alternative to vLLM; ⚠️ may need SM 8.0)
enable_tensorrt_llm: stopped        # NVIDIA TensorRT LLM (⚠️ BLOCKED: needs SM 8.0+)
enable_smarter_router: stopped      # VRAM-aware LLM routing
enable_yt_dlp_web_ui: stopped       # NAS-friendly yt-dlp web UI
enable_stalwart: stopped            # Modern mail server (alternative to Mailu)
enable_postal: stopped              # Transactional mail server
enable_opensanctions: stopped       # Org/person screening
enable_gophish: stopped             # Phishing simulation/testing
enable_recallium: stopped           # AI memory (minimal, 28 stars)
enable_zenii: stopped               # 20MB memory brain (minimal, 16 stars)
enable_auto1111: stopped
enable_tubearchivist: stopped
enable_dify: stopped
enable_bloop: stopped

# ── Python Library Tools (Conda Envs) ──────────────────────────────
# These are NOT Docker services — installed as host Conda environments.
# HW: All POSSIBLE — CPU inference works but slow. 107GB RAM handles models.
# ⚠️ BLOCKER: vLLM GPU mode is hard-blocked (SM 6.1 < SM 8.0 required)
enable_conda_ai_libs: stopped       # transformers, bitsandbytes, accelerate
enable_conda_airllm: stopped        # AirLLM (70B-405B on 4GB via layer streaming)
enable_conda_heretic: stopped       # LLM decensor via abliteration
enable_conda_mergekit: stopped      # Model merging (SLERP, TIES, DARE)
enable_conda_exllama: stopped       # exllamav2 (4-bit EXL2 inference)
enable_conda_abliteration: stopped  # Simpler LLM uncensor

# ── AI Tools Port Assignments ──────────────────────────────────────
# OCR
glm_ocr_port: 5520
paddle_ocr_port: 5510
marker_port: 5511

# Speech-to-Text
faster_whisper_port: 5501
