---
# Homelab Inventory
# Host cf0 (alias ubu1) - Main LLM + AI Tools server
# Hardware: i9-9900K (16 threads), 107GB RAM, GTX 1060 6GB

all:
  children:
    homelab:
      hosts:
        cf0:
          ansible_host: cf0
          ansible_user: r
          ansible_python_interpreter: /usr/bin/python3
          ansible_become: true
          ansible_become_method: sudo
      vars:
        # Base paths
        homelab_base_path: /opt/homelab
        compose_path: "{{ homelab_base_path }}/compose"
        vendor_path: "{{ homelab_base_path }}/vendor"
        
        # Hardware info
        gpu_enabled: true
        gpu_driver: nvidia
        total_ram_gb: 107
        cpu_threads: 16
        host_runtime_gpu_model: GTX 1060 6GB
        host_runtime_gpu_microarchitecture: pascal
        host_runtime_gpu_compute_capability: "6.1"
        host_runtime_vllm_gpu_supported: false
        host_runtime_cpu_supports_avx2: true
        
        # Network
        nic_name: eno1
        bandwidth_limit: "50mbit"
        
        # Docker settings
        docker_network_name: homelab-network
        docker_prune_images: true
        docker_prune_volumes: false
        
        # User settings
        admin_user: r
        admin_group: r
        admin_home: /home/r
        
        # Timezone
        timezone: UTC
